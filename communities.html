<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجتمعات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --surface3: #22222f;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --text: #f0f0ff;
    --text2: #9090b0;
    --text3: #5a5a7a;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(67,233,123,0.07) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  #app { position: relative; z-index: 1; min-height: 100vh; }
  .container { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  /* TOPBAR */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.88); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .topbar-logo { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 14px 5px 5px;
    font-size: 14px; font-weight: 500; color: var(--text2); cursor: pointer; transition: background 0.2s;
  }
  .user-chip:hover { background: var(--surface3); }
  .user-avatar-img {
    width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--accent);
  }
  .user-avatar-placeholder {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white; flex-shrink: 0;
  }

  /* BUTTONS */
  .btn { font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 999px; border: none; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; }
  .btn-primary:hover { opacity: 0.85; transform: scale(1.03); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface3); }
  .btn-danger { background: rgba(255,101,132,0.15); color: var(--accent2); border: 1px solid rgba(255,101,132,0.3); }
  .btn-danger:hover { background: rgba(255,101,132,0.25); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-xs { padding: 4px 10px; font-size: 12px; }

  /* PAGES */
  .page { display: none; }
  .page.active { display: block; }

  /* HOME */
  .home-header { padding: 36px 0 24px; text-align: center; }
  .home-title { font-size: 30px; font-weight: 900; margin-bottom: 8px; }
  .home-subtitle { color: var(--text2); font-size: 15px; }
  .search-bar { position: relative; margin: 20px 0; }
  .search-bar input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 999px; padding: 13px 50px 13px 20px;
    font-family: 'Tajawal', sans-serif; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text3); }
  .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 17px; }
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); margin-bottom: 12px; }
  .communities-grid { display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }

  /* COMMUNITY CARD */
  .community-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: all 0.2s;
  }
  .community-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108,99,255,0.15); }
  .card-banner { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 36px; position: relative; }
  .card-banner-img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 14px 16px; }
  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; }
  .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 16px; font-weight: 700; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-desc { font-size: 13px; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { display: flex; align-items: center; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--text3); }

  /* FAB */
  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white;
    border: none; border-radius: 999px; padding: 15px 26px;
    font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 32px rgba(108,99,255,0.4);
    z-index: 50; transition: all 0.2s;
  }
  .fab:hover { transform: translateX(-50%) scale(1.05); }

  /* COMMUNITY PAGE */
  .community-header { border-bottom: 1px solid var(--border); margin-bottom: 0; }
  .community-banner-wrap { height: 140px; position: relative; overflow: hidden; }
  .community-banner-bg { width: 100%; height: 100%; object-fit: cover; }
  .community-banner-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 52px; }
  .community-info-row { padding: 14px 16px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .community-name-big { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  .community-desc-big { color: var(--text2); font-size: 14px; line-height: 1.5; }
  .community-stats { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--text3); }
  .community-stats strong { color: var(--text); font-weight: 700; }
  .mod-badge { background: rgba(108,99,255,0.2); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; display: inline-block; margin-top: 6px; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab { flex: 1; padding: 13px; text-align: center; font-size: 14px; font-weight: 600; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; font-family: 'Tajawal', sans-serif; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* PINNED MSG */
  .pinned-msg {
    background: rgba(108,99,255,0.1); border: 1px solid rgba(108,99,255,0.3);
    border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px;
    font-size: 13px; display: flex; align-items: flex-start; gap: 8px;
  }
  .pinned-icon { font-size: 16px; flex-shrink: 0; }
  .pinned-text { color: var(--text2); flex: 1; }
  .pinned-author { color: var(--accent); font-weight: 700; font-size: 12px; }

  /* COMPOSER */
  .composer { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .composer-top { display: flex; gap: 10px; align-items: flex-start; }
  .composer-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .composer-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .composer-avatar-ph { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: white; flex-shrink: 0; }
  .composer textarea { flex: 1; background: none; border: none; color: var(--text); font-family: 'Tajawal', sans-serif; font-size: 15px; resize: none; outline: none; min-height: 65px; line-height: 1.6; }
  .composer textarea::placeholder { color: var(--text3); }
  .composer-bottom { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  /* POSTS */
  .post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .post-avatar-ph { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
  .post-author { font-weight: 700; font-size: 14px; }
  .post-author-role { font-size: 11px; color: var(--accent); font-weight: 600; }
  .post-time { font-size: 11px; color: var(--text3); margin-right: auto; }
  .post-body { font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
  .post-actions { display: flex; gap: 16px; align-items: center; }
  .post-action { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); cursor: pointer; background: none; border: none; font-family: 'Tajawal', sans-serif; transition: color 0.2s; padding: 3px 0; }
  .post-action:hover { color: var(--accent); }
  .post-action.liked { color: var(--accent2); }
  .post-mod-actions { margin-right: auto; display: flex; gap: 8px; }

  /* CHAT */
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 300px); min-height: 380px; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .chat-msg { display: flex; gap: 8px; animation: fadeUp 0.2s ease; position: relative; }
  .chat-msg:hover .chat-msg-actions { opacity: 1; }
  .chat-msg-avatar { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-top: 2px; }
  .chat-msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-msg-avatar-ph { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; flex-shrink: 0; margin-top: 2px; }
  .chat-msg-name { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .chat-msg-name .role-badge { font-size: 10px; color: var(--accent); margin-right: 4px; }
  .chat-msg-bubble { background: var(--surface2); border-radius: 4px 14px 14px 14px; padding: 9px 13px; font-size: 14px; line-height: 1.6; max-width: 500px; word-break: break-word; border: 1px solid var(--border); }
  .chat-msg-bubble.pinned-bubble { border-color: rgba(108,99,255,0.4); background: rgba(108,99,255,0.08); }
  .chat-msg-time { font-size: 10px; color: var(--text3); margin-top: 3px; }
  .chat-msg-actions { opacity: 0; transition: opacity 0.2s; display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; }
  .chat-action-btn { background: var(--surface3); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 11px; cursor: pointer; color: var(--text2); font-family: 'Tajawal', sans-serif; transition: all 0.15s; white-space: nowrap; }
  .chat-action-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  .chat-action-btn.danger:hover { background: var(--accent2); border-color: var(--accent2); }
  .chat-input-area { padding: 12px 0 2px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
  .chat-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 11px 15px; font-family: 'Tajawal', sans-serif; font-size: 14px; color: var(--text); resize: none; outline: none; min-height: 44px; max-height: 110px; transition: border-color 0.2s; line-height: 1.5; }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--text3); }
  .chat-send { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .chat-send:hover { opacity: 0.85; transform: scale(1.05); }
  .banned-notice { text-align: center; padding: 20px; color: var(--accent2); font-size: 14px; background: rgba(255,101,132,0.08); border-radius: var(--radius-sm); margin: 10px 0; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; transform: scale(0.95) translateY(20px); transition: transform 0.25s; scrollbar-width: thin; }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }
  .modal-title { font-size: 19px; font-weight: 900; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 7px; letter-spacing: 0.5px; }
  .form-input, .form-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 15px; font-family: 'Tajawal', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
  .form-textarea { resize: none; min-height: 80px; line-height: 1.6; }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 8px; }
  .emoji-btn { width: 38px; height: 38px; border-radius: 9px; background: var(--surface2); border: 2px solid transparent; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .emoji-btn:hover { background: var(--surface3); transform: scale(1.1); }
  .emoji-btn.selected { border-color: var(--accent); background: rgba(108,99,255,0.15); }
  .color-grid { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
  .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
  .color-btn.selected { border-color: white; transform: scale(1.15); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* IMAGE UPLOAD */
  .img-upload-wrap { position: relative; cursor: pointer; }
  .img-upload-input { display: none; }
  .img-upload-preview { width: 100%; height: 120px; border-radius: var(--radius-sm); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: var(--text3); font-size: 13px; transition: border-color 0.2s; overflow: hidden; cursor: pointer; }
  .img-upload-preview:hover { border-color: var(--accent); }
  .img-upload-preview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-upload-preview { width: 80px; height: 80px; border-radius: 50%; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; color: var(--text3); font-size: 11px; cursor: pointer; overflow: hidden; transition: border-color 0.2s; }
  .avatar-upload-preview:hover { border-color: var(--accent); }
  .avatar-upload-preview img { width: 100%; height: 100%; object-fit: cover; }

  /* USERNAME MODAL */
  .welcome-icon { text-align: center; font-size: 48px; margin-bottom: 12px; }
  .modal-center-title { text-align: center; font-size: 22px; font-weight: 900; margin-bottom: 8px; }
  .modal-subtitle { color: var(--text2); font-size: 14px; text-align: center; margin-bottom: 20px; line-height: 1.6; }

  /* MEMBERS / MOD PANEL */
  .member-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .member-row:last-child { border-bottom: none; }
  .member-name { flex: 1; font-size: 14px; font-weight: 600; }
  .member-role { font-size: 11px; color: var(--accent); }
  .member-actions { display: flex; gap: 6px; }

  /* BACK */
  .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text2); cursor: pointer; font-size: 14px; font-weight: 600; background: none; border: none; font-family: 'Tajawal', sans-serif; padding: 10px 16px; transition: color 0.2s; }
  .back-btn:hover { color: var(--text); }

  /* EMPTY / LOADING */
  .empty { text-align: center; padding: 50px 20px; color: var(--text3); }
  .empty-icon { font-size: 44px; margin-bottom: 12px; }
  .loading { text-align: center; padding: 36px; color: var(--text3); font-size: 14px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 11px 20px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: all 0.3s; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 480px) {
    .topbar { padding: 10px 12px; }
    .container { padding: 0 10px; }
    .home-title { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo" onclick="showPage('home')">🌐 مجتمعات</div>
    <div class="user-chip" onclick="showUsernameModal()" id="userChip">
      <div id="topbarAvatarWrap"></div>
      <span id="topbarName">حدد اسمك</span>
    </div>
  </div>

  <!-- HOME PAGE -->
  <div id="page-home" class="page active">
    <div class="container">
      <div class="home-header">
        <div class="home-title">اكتشف المجتمعات</div>
        <div class="home-subtitle">انضم أو أنشئ مجتمعك الخاص</div>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ابحث عن مجتمع..." oninput="filterCommunities()">
        <span class="search-icon">🔍</span>
      </div>
      <div class="section-title">كل المجتمعات</div>
      <div class="communities-grid" id="communitiesGrid">
        <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
      </div>
    </div>
    <button class="fab" onclick="showCreateModal()">＋ إنشاء مجتمع</button>
  </div>

  <!-- COMMUNITY PAGE -->
  <div id="page-community" class="page">
    <button class="back-btn" onclick="showPage('home')">← رجوع</button>
    <div class="community-header">
      <div class="community-banner-wrap" id="communityBannerWrap"></div>
      <div class="community-info-row">
        <div style="flex:1">
          <div class="community-name-big" id="communityName"></div>
          <div class="community-desc-big" id="communityDesc"></div>
          <div class="community-stats">
            <span><strong id="communityPostCount">0</strong> منشور</span>
            <span><strong id="communityMsgCount">0</strong> رسالة</span>
          </div>
          <div id="myRoleBadge"></div>
        </div>
        <div id="communityModBtn"></div>
      </div>
    </div>

    <div class="container">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('posts')" id="tab-posts">📝 المنشورات</button>
        <button class="tab" onclick="switchTab('chat')" id="tab-chat">💬 المحادثة</button>
        <button class="tab" onclick="switchTab('members')" id="tab-members">👥 الأعضاء</button>
      </div>

      <!-- POSTS TAB -->
      <div id="tab-content-posts">
        <div class="composer" id="postComposer">
          <div class="composer-top">
            <div id="composerAvatarWrap"></div>
            <textarea id="postInput" placeholder="شارك شيئاً مع المجتمع..." rows="3"></textarea>
          </div>
          <div class="composer-bottom">
            <button class="btn btn-primary btn-sm" onclick="submitPost()">نشر</button>
          </div>
        </div>
        <div id="postsList"></div>
      </div>

      <!-- CHAT TAB -->
      <div id="tab-content-chat" style="display:none">
        <div id="pinnedMsgWrap"></div>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div id="chatInputArea" class="chat-input-area">

// ===== IMAGE HANDLING =====
function compressImage(file, maxW, maxH, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW) { h = h*(maxW/w); w = maxW; }
        if (h > maxH) { w = w*(maxH/h); h = maxH; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

window.openCommunity = async function(id) {
  currentCommunityId = id;
  showPage('community');

    const snap = await getDoc(doc(db,'communities',id));
    currentCommunityData = {id, ...snap.data()};

    // banner
    const bw = document.getElementById('communityBannerWrap');
    if (c.image) bw.innerHTML=`<img class="community-banner-bg" src="${c.image}">`;
    else bw.innerHTML=`<div class="community-banner-placeholder" style="background:linear-gradient(135deg,${c.color}33,${c.color}11)">${c.emoji}</div>`;

    // my role
    const isMod = isModerator(c);
    const isOwner = c.createdBy === getUsername();
    document.getElementById('myRoleBadge').innerHTML = isOwner ? '<span class="mod-badge">👑 صاحب المجتمع</span>' : isMod ? '<span class="mod-badge">🛡️ مشرف</span>' : '';

    document.getElementById('communityModBtn').innerHTML = isMod ?
      `<button class="btn btn-ghost btn-sm" onclick="openModPanel()">⚙️ إدارة</button>` : '';

    switchTab('posts');
  } catch(e) { showToast('❌ '+e.message); }
};

function isModerator(c) {
  const u = getUsername();
  return u && (c.createdBy===u || (c.moderators&&c.moderators.includes(u)));
}
function isUserBanned(c) {
  const u = getUsername();
  if (!u || !c.bannedUsers) return false;
  const ban = c.bannedUsers.find(b=>b.username===u);
  if (!ban) return false;
  if (ban.type==='permanent') return true;
  if (ban.type==='timeout') {
    if (Date.now() < ban.until) return true;
    // expired - remove
    updateDoc(doc(db,'communities',currentCommunityId),{bannedUsers: arrayRemove(ban)});
    return false;
  }
  return false;
}

  } else pw.innerHTML='';

  // banned check
  const banned = isUserBanned(c);
  const inputArea = document.getElementById('chatInputArea');

    inputArea.innerHTML='<div class="banned-notice">🚫 أنت محظور من هذا المجتمع ولا يمكنك إرسال رسائل</div>';
  } else {

  }

  chatUnsubscribe = onSnapshot(
    query(collection(db,'communities',currentCommunityId,'messages'),orderBy('createdAt','asc')),
    snap=>{
      msgs.innerHTML='';
      if (snap.empty) { msgs.innerHTML='<div class="empty"><div class="empty-icon">💬</div><div>لا توجد رسائل بعد</div></div>'; return; }
      const isMod2 = isModerator(c);
      snap.docs.forEach(d=>{
        const m=d.data();
        const time=m.createdAt?m.createdAt.toDate().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}):'';
        const isPinned = c.pinnedMessage&&c.pinnedMessage.id===d.id;
        const div=document.createElement('div');
        div.className='chat-msg';
        const isOwnerMsg = m.author===getUsername();
        const modActions = isMod2 ? `
          <div class="chat-msg-actions">
            <button class="chat-action-btn" onclick="pinMessage('${d.id}','${escAttr(m.body)}','${m.author}')">📌 تثبيت</button>
            <button class="chat-action-btn danger" onclick="deleteMessage('${d.id}')">🗑️</button>
            ${!isOwnerMsg?`<button class="chat-action-btn danger" onclick="openBanModal('${m.author}')">🚫</button>`:''}
          </div>` : '';
        div.innerHTML=`
          <div class="chat-msg-avatar">${avatarHTML(m.author||'؟',m.authorAvatar||'',30)}</div>
          <div class="chat-msg-content">
            <div class="chat-msg-name">${m.author||'مجهول'}${(c.moderators&&c.moderators.includes(m.author))?'<span class="role-badge">🛡️</span>':''} ${c.createdBy===m.author?'<span class="role-badge">👑</span>':''}</div>
            <div class="chat-msg-bubble${isPinned?' pinned-bubble':''}">${escHtml(m.body)}</div>
            <div class="chat-msg-time">${time}</div>
          </div>
          ${modActions}`;
        msgs.appendChild(div);
      });
      msgs.scrollTop=msgs.scrollHeight;
    }
  );
};

window.sendChat = async function() {
  if (!requireUsername()) return;
  if (isUserBanned(currentCommunityData)) { showToast('🚫 أنت محظور'); return; }
  const input = document.getElementById('chatInput');
  if (!input) return;
  const body=input.value.trim(); if (!body) return;
  try {
    input.value=''; input.style.height='auto';
    await addDoc(collection(db,'communities',currentCommunityId,'messages'),{
      body, author:getUsername(), authorAvatar:getAvatar(), createdAt:serverTimestamp()
    });
    await updateDoc(doc(db,'communities',currentCommunityId),{msgCount:increment(1)});
    document.getElementById('communityMsgCount').textContent=parseInt(document.getElementById('communityMsgCount').textContent||0)+1;
  } catch(e) { showToast('❌ '+e.message); }
};

window.deleteMessage = async function(msgId) {
  try {
    await deleteDoc(doc(db,'communities',currentCommunityId,'messages',msgId));
    showToast('✅ تم حذف الرسالة');
  } catch(e) { showToast('❌ '+e.message); }
};

window.pinMessage = async function(msgId, body, author) {
  try {
    await updateDoc(doc(db,'communities',currentCommunityId),{pinnedMessage:{id:msgId,body,author}});
    currentCommunityData.pinnedMessage={id:msgId,body,author};
    showToast('📌 تم تثبيت الرسالة');
    loadChat();
  } catch(e) { showToast('❌ '+e.message); }
};

// ===== MEMBERS =====
window.loadMembers = async function() {
  const list = document.getElementById('membersList');
  list.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try {
    // collect unique users from messages+posts
    const [postsSnap, msgsSnap] = await Promise.all([
      getDocs(collection(db,'communities',currentCommunityId,'posts')),
      getDocs(collection(db,'communities',currentCommunityId,'messages'))
    ]);
    const users = {};
    [...postsSnap.docs,...msgsSnap.docs].forEach(d=>{
      const a=d.data().author; if(a&&!users[a]) users[a]={name:a,avatar:d.data().authorAvatar||''};
    });
    // add owner
    const owner = currentCommunityData.createdBy;
    if (owner&&!users[owner]) users[owner]={name:owner,avatar:''};

    const c=currentCommunityData; const isMod2=isModerator(c);
    const entries=Object.values(users);
    if (!entries.length) { list.innerHTML='<div class="empty"><div class="empty-icon">👥</div><div>لا يوجد أعضاء بعد</div></div>'; return; }

    list.innerHTML=entries.map(u=>{
      const isOwner2=u.name===c.createdBy;
      const isMod3=c.moderators&&c.moderators.includes(u.name);
      const isBanned=c.bannedUsers&&c.bannedUsers.find(b=>b.username===u.name);
      return `<div class="member-row">
        ${avatarHTML(u.name,u.avatar,36)}
        <div class="member-name">${u.name} ${isOwner2?'<span class="member-role">👑 صاحب</span>':isMod3?'<span class="member-role">🛡️ مشرف</span>':''} ${isBanned?'<span style="color:var(--accent2);font-size:11px">🚫 محظور</span>':''}</div>
        ${isMod2&&!isOwner2?`<div class="member-actions"><button class="btn btn-ghost btn-xs" onclick="openBanModal('${u.name}')">🚫 حظر</button></div>`:''}
      </div>`;
    }).join('');
  } catch(e) { list.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><div>${e.message}</div></div>`; }
};

// ===== MOD PANEL =====
window.openModPanel = function() {
  const c=currentCommunityData;
  document.getElementById('modsList').innerHTML=(c.moderators||[]).map(m=>
    m===c.createdBy?`<div class="member-row">${avatarHTML(m,'',32)}<div class="member-name">${m} <span class="member-role">👑 صاحب</span></div></div>`:
    `<div class="member-row">${avatarHTML(m,'',32)}<div class="member-name">${m} <span class="member-role">🛡️ مشرف</span></div><button class="btn btn-danger btn-xs" onclick="removeModerator('${m}')">إزالة</button></div>`
  ).join('')||'<div style="color:var(--text3);font-size:13px;padding:8px">لا يوجد مشرفون</div>';
  document.getElementById('addModInput').value='';
  openModal('modModal');
};
window.addModerator = async function() {
  const name=document.getElementById('addModInput').value.trim();
  if (!name) { showToast('⚠️ اكتب اسم المشرف'); return; }
  try {
    await updateDoc(doc(db,'communities',currentCommunityId),{moderators:arrayUnion(name)});
    currentCommunityData.moderators=[...(currentCommunityData.moderators||[]),name];
    showToast('✅ تم إضافة المشرف'); openModPanel();
  } catch(e) { showToast('❌ '+e.message); }
};
window.removeModerator = async function(name) {
  try {
    await updateDoc(doc(db,'communities',currentCommunityId),{moderators:arrayRemove(name)});
    currentCommunityData.moderators=(currentCommunityData.moderators||[]).filter(m=>m!==name);
    showToast('✅ تم إزالة المشرف'); openModPanel();
  } catch(e) { showToast('❌ '+e.message); }
};

// ===== BAN =====
window.openBanModal = function(username) {
  banTargetUser=username; banType='permanent'; timeoutMinutes=60;
  document.getElementById('banModalTitle').textContent=`🚫 حظر: ${username}`;
  document.getElementById('banReason').value='';
  document.getElementById('timeoutDurationWrap').style.display='none';
  document.getElementById('banTypePerm').style.background='var(--accent)';document.getElementById('banTypePerm').style.color='white';
  document.getElementById('banTypeTimeout').style.background='';document.getElementById('banTypeTimeout').style.color='';
  openModal('banModal');
};
window.setBanType = function(type) {
  banType=type;
  document.getElementById('timeoutDurationWrap').style.display=type==='timeout'?'block':'none';
  document.getElementById('banTypePerm').style.background=type==='permanent'?'var(--accent)':'';
  document.getElementById('banTypePerm').style.color=type==='permanent'?'white':'';
  document.getElementById('banTypeTimeout').style.background=type==='timeout'?'var(--accent)':'';
  document.getElementById('banTypeTimeout').style.color=type==='timeout'?'white':'';
};
window.setTimeoutDuration = function(mins) { timeoutMinutes=mins; document.getElementById('timeoutCustom').value=mins; };
window.confirmBan = async function() {
  if (!banTargetUser) return;
  const reason=document.getElementById('banReason').value.trim();
  const custom=parseInt(document.getElementById('timeoutCustom')?.value)||timeoutMinutes;
  const banObj = banType==='permanent'
    ? {username:banTargetUser,type:'permanent',reason,bannedAt:Date.now()}
    : {username:banTargetUser,type:'timeout',until:Date.now()+(custom*60000),reason,bannedAt:Date.now()};
  try {
    // remove old ban if exists
    const oldBan=(currentCommunityData.bannedUsers||[]).find(b=>b.username===banTargetUser);
    if(oldBan) await updateDoc(doc(db,'communities',currentCommunityId),{bannedUsers:arrayRemove(oldBan)});
    await updateDoc(doc(db,'communities',currentCommunityId),{bannedUsers:arrayUnion(banObj)});
    currentCommunityData.bannedUsers=[...(currentCommunityData.bannedUsers||[]).filter(b=>b.username!==banTargetUser),banObj];
    closeModal('banModal');
    const msg=banType==='permanent'?`🚫 تم حظر ${banTargetUser} بشكل دائم`:`⏱️ تم حظر ${banTargetUser} لمدة ${custom} دقيقة`;
    showToast(msg);
    if(document.getElementById('tab-members').classList.contains('active')) loadMembers();
  } catch(e) { showToast('❌ '+e.message); }
};

// ===== HELPERS =====
function requireUsername() { if(!getUsername()){showUsernameModal();return false;} return true; }
function timeAgo(date) {
  const s=Math.floor((new Date()-date)/1000);
  if(s<60) return 'الآن'; if(s<3600) return `منذ ${Math.floor(s/60)} د`; if(s<86400) return `منذ ${Math.floor(s/3600)} س`; return `منذ ${Math.floor(s/86400)} ي`;
}
function escHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function escAttr(str) { return str.replace(/"/g,'&quot;').replace(/'/g,'&#39;').substring(0,100); }
window.autoResize = el => { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; };
window.showToast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); };

// ===== INIT =====
updateTopbar();
loadCommunities();
if (!getUsername()) setTimeout(()=>openModal('usernameModal'),600);
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
</script>
