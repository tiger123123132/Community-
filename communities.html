<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجتمعات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --surface3: #22222f;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --text: #f0f0ff;
    --text2: #9090b0;
    --text3: #5a5a7a;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== BACKGROUND ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(67,233,123,0.07) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== LAYOUT ===== */
  #app { position: relative; z-index: 1; min-height: 100vh; }

  .container { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  /* ===== TOPBAR ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .topbar-logo {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    cursor: pointer;
    user-select: none;
  }

  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: white;
  }
  .btn-primary:hover { opacity: 0.85; transform: scale(1.03); }

  .btn-ghost {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface3); }

  .btn-sm { padding: 6px 14px; font-size: 13px; }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px 6px 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    transition: background 0.2s;
  }
  .user-chip:hover { background: var(--surface3); }
  .user-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white;
  }

  /* ===== PAGES ===== */
  .page { display: none; }
  .page.active { display: block; }

  /* ===== HOME PAGE ===== */
  .home-header {
    padding: 40px 0 28px;
    text-align: center;
  }
  .home-title {
    font-size: 32px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .home-subtitle { color: var(--text2); font-size: 16px; }

  .search-bar {
    position: relative;
    margin: 24px 0;
  }
  .search-bar input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 14px 52px 14px 20px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text3); }
  .search-icon {
    position: absolute;
    left: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 18px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text3);
    margin-bottom: 14px;
  }

  /* ===== COMMUNITY CARDS ===== */
  .communities-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 80px;
  }

  .community-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .community-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px; height: 100%;
    border-radius: 0 var(--radius) var(--radius) 0;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .community-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(108,99,255,0.15);
  }
  .community-card:hover::before { opacity: 1; background: var(--accent); }

  .card-top { display: flex; align-items: flex-start; gap: 14px; }
  .card-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-desc {
    font-size: 14px;
    color: var(--text2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--text3);
  }
  .card-meta span { display: flex; align-items: center; gap: 5px; }

  /* ===== FAB ===== */
  .fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 16px 28px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(108,99,255,0.4);
    z-index: 50;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .fab:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 12px 40px rgba(108,99,255,0.5); }

  /* ===== COMMUNITY PAGE ===== */
  .community-header {
    position: relative;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .community-banner {
    height: 130px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }
  .community-meta-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .community-name-big { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
  .community-desc-big { color: var(--text2); font-size: 15px; line-height: 1.5; }
  .community-stats {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--text3);
  }
  .community-stats strong { color: var(--text); font-weight: 700; }

  /* ===== TABS ===== */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Tajawal', sans-serif;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text2); }

  /* ===== POST COMPOSER ===== */
  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .composer-top { display: flex; gap: 12px; align-items: flex-start; }
  .composer-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: white;
    flex-shrink: 0;
  }
  .composer textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    resize: none;
    outline: none;
    min-height: 70px;
    line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--text3); }
  .composer-bottom {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  /* ===== POSTS ===== */
  .post {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .post-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white;
    flex-shrink: 0;
  }
  .post-author { font-weight: 700; font-size: 15px; }
  .post-time { font-size: 12px; color: var(--text3); margin-right: auto; }
  .post-body { font-size: 15px; line-height: 1.7; color: var(--text); margin-bottom: 14px; }
  .post-actions { display: flex; gap: 20px; }
  .post-action {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text3);
    cursor: pointer;
    background: none; border: none; font-family: 'Tajawal', sans-serif;
    transition: color 0.2s;
    padding: 4px 0;
  }
  .post-action:hover { color: var(--accent); }
  .post-action.liked { color: var(--accent2); }

  /* ===== CHAT ===== */
  .chat-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 280px);
    min-height: 400px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .chat-msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.25s ease;
  }
  .chat-msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .chat-msg-content {}
  .chat-msg-name { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .chat-msg-bubble {
    background: var(--surface2);
    border-radius: 4px 14px 14px 14px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 500px;
    word-break: break-word;
    border: 1px solid var(--border);
  }
  .chat-msg-time { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .chat-input-area {
    padding: 14px 0 4px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    min-height: 46px;
    max-height: 120px;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--text3); }
  .chat-send {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .chat-send:hover { opacity: 0.85; transform: scale(1.05); }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 460px;
    transform: scale(0.95) translateY(20px);
    transition: transform 0.25s;
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }
  .modal-title {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 22px;
  }

  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .form-input, .form-textarea, .form-select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
  .form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
  .form-textarea { resize: none; min-height: 90px; line-height: 1.6; }
  .form-select { appearance: none; cursor: pointer; }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .emoji-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--surface2);
    border: 2px solid transparent;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .emoji-btn:hover { background: var(--surface3); transform: scale(1.1); }
  .emoji-btn.selected { border-color: var(--accent); background: rgba(108,99,255,0.15); }

  .color-grid {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
  }
  .color-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .color-btn.selected { border-color: white; transform: scale(1.15); }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  /* ===== USERNAME MODAL ===== */
  .username-modal .modal-title { text-align: center; font-size: 24px; }
  .username-modal .welcome-icon {
    text-align: center;
    font-size: 52px;
    margin-bottom: 16px;
  }
  .username-modal p {
    color: var(--text2);
    font-size: 15px;
    text-align: center;
    margin-bottom: 22px;
    line-height: 1.6;
  }

  /* ===== EMPTY STATE ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 48px; margin-bottom: 14px; }
  .empty-text { font-size: 16px; margin-bottom: 6px; }
  .empty-sub { font-size: 14px; }

  /* ===== LOADING ===== */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text3);
    font-size: 14px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== BACK BTN ===== */
  .back-btn {
    display: flex; align-items: center; gap: 8px;
    color: var(--text2);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    background: none;
    border: none;
    font-family: 'Tajawal', sans-serif;
    padding: 10px 0;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--text); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    z-index: 999;
    opacity: 0;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 480px) {
    .topbar { padding: 12px 14px; }
    .topbar-logo { font-size: 18px; }
    .home-title { font-size: 24px; }
    .container { padding: 0 12px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo" onclick="showPage('home')">🌐 مجتمعات</div>
    <div class="topbar-actions">
      <div id="userChip" class="user-chip" onclick="showUsernameModal()">
        <div class="user-avatar" id="topbarAvatar" style="background:#6c63ff">؟</div>
        <span id="topbarName">اضغط لتحديد اسمك</span>
      </div>
    </div>
  </div>

  <!-- HOME PAGE -->
  <div id="page-home" class="page active">
    <div class="container">
      <div class="home-header">
        <div class="home-title">اكتشف المجتمعات</div>
        <div class="home-subtitle">انضم أو أنشئ مجتمعك الخاص</div>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ابحث عن مجتمع..." oninput="filterCommunities()">
        <span class="search-icon">🔍</span>
      </div>
      <div class="section-title">كل المجتمعات</div>
      <div class="communities-grid" id="communitiesGrid">
        <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
      </div>
    </div>
    <button class="fab" onclick="showCreateModal()">
      ＋ إنشاء مجتمع
    </button>
  </div>

  <!-- COMMUNITY PAGE -->
  <div id="page-community" class="page">
    <div class="container">
      <div class="community-header">
        <button class="back-btn" onclick="showPage('home')">← رجوع</button>
        <div class="community-banner" id="communityBanner"></div>
        <div class="community-meta-row">
          <div>
            <div class="community-name-big" id="communityName"></div>
            <div class="community-desc-big" id="communityDesc"></div>
            <div class="community-stats">
              <span><strong id="communityPostCount">0</strong> منشور</span>
              <span><strong id="communityMsgCount">0</strong> رسالة</span>
            </div>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('posts')" id="tab-posts">📝 المنشورات</button>
        <button class="tab" onclick="switchTab('chat')" id="tab-chat">💬 التشات</button>
      </div>

      <!-- POSTS TAB -->
      <div id="tab-content-posts">
        <div class="composer">
          <div class="composer-top">
            <div class="composer-avatar" id="composerAvatar" style="background:#6c63ff">؟</div>
            <textarea id="postInput" placeholder="شارك شيئاً مع المجتمع..." rows="3"></textarea>
          </div>
          <div class="composer-bottom">
            <button class="btn btn-primary btn-sm" onclick="submitPost()">نشر</button>
          </div>
        </div>
        <div id="postsList"></div>
      </div>

      <!-- CHAT TAB -->
      <div id="tab-content-chat" style="display:none">
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-area">
            <textarea class="chat-input" id="chatInput" placeholder="اكتب رسالة..." rows="1"
              onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendChat()}"
              oninput="autoResize(this)"></textarea>
            <button class="chat-send" onclick="sendChat()">↑</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- CREATE COMMUNITY MODAL -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-title">🏘️ إنشاء مجتمع جديد</div>

    <div class="form-group">
      <label class="form-label">اسم المجتمع</label>
      <input type="text" class="form-input" id="newCommunityName" placeholder="مثال: عشاق السيارات" maxlength="40">
    </div>

    <div class="form-group">
      <label class="form-label">وصف المجتمع</label>
      <textarea class="form-textarea" id="newCommunityDesc" placeholder="وش هو المجتمع هذا؟" maxlength="200"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">الأيقونة</label>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="form-group">
      <label class="form-label">اللون</label>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('createModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="createCommunity()">إنشاء ✨</button>
    </div>
  </div>
</div>

<!-- USERNAME MODAL -->
<div class="modal-overlay" id="usernameModal">
  <div class="modal username-modal">
    <div class="welcome-icon">👋</div>
    <div class="modal-title">مرحباً!</div>
    <p>اختر اسماً يظهر في المجتمعات. لا تحتاج حساب أو كلمة سر.</p>
    <div class="form-group">
      <input type="text" class="form-input" id="usernameInput" placeholder="اسمك هنا..." maxlength="20"
        onkeydown="if(event.key==='Enter') saveUsername()">
    </div>
    <button class="btn btn-primary" style="width:100%;padding:14px" onclick="saveUsername()">دخول 🚀</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, increment,
         query, orderBy, onSnapshot, serverTimestamp, getDoc }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

// ============================================================
// 🔧 ضع هنا إعدادات Firebase الخاصة بك
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCcRQ-LSZKJZ4Q0kXgQEbvxwoWbs4rbC3Q",
  authDomain: "community-83601.firebaseapp.com",
  projectId: "community-83601",
  storageBucket: "community-83601.firebasestorage.app",
  messagingSenderId: "56412149109",
  appId: "1:56412149109:web:84eca0988fb5c1ad2fef3c",
  measurementId: "G-LZQEMMJ963"
};
// ============================================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db;

// ===== COLORS & EMOJIS =====
const EMOJIS = ['🏀','⚽','🎮','🎵','📚','🍕','✈️','💻','🎨','🌍','🔬','💪','🎭','🤖','🌸','🦁','🏖️','🎯','🚗','💡','🎸','📸','🏋️','🌿','🎪','💎','🔥','⚡'];
const COLORS = ['#6c63ff','#ff6584','#43e97b','#f7971e','#4facfe','#f953c6','#43cbff','#ff9a9e','#a18cd1','#ffecd2','#96fbc4','#f093fb'];

let selectedEmoji = EMOJIS[0];
let selectedColor = COLORS[0];
let currentCommunityId = null;
let chatUnsubscribe = null;
let allCommunities = [];

// ===== USERNAME =====
function getUsername() { return localStorage.getItem('mj_username') || ''; }
function getUserColor() {
  const u = getUsername();
  if (!u) return '#6c63ff';
  const colors = ['#6c63ff','#ff6584','#43e97b','#f7971e','#4facfe','#f953c6','#43cbff'];
  return colors[u.charCodeAt(0) % colors.length];
}
function getInitial() {
  const u = getUsername();
  return u ? u[0] : '؟';
}

window.showUsernameModal = function() {
  document.getElementById('usernameInput').value = getUsername();
  openModal('usernameModal');
  setTimeout(() => document.getElementById('usernameInput').focus(), 300);
};

window.saveUsername = function() {
  const val = document.getElementById('usernameInput').value.trim();
  if (!val) { showToast('⚠️ اكتب اسمك أولاً'); return; }
  localStorage.setItem('mj_username', val);
  closeModal('usernameModal');
  updateTopbar();
  showToast('✅ تم حفظ اسمك!');
};

function updateTopbar() {
  const u = getUsername();
  const chip = document.getElementById('topbarName');
  const av = document.getElementById('topbarAvatar');
  if (u) {
    chip.textContent = u;
    av.textContent = u[0];
    av.style.background = getUserColor();
  } else {
    chip.textContent = 'اضغط لتحديد اسمك';
    av.textContent = '؟';
  }
  document.getElementById('composerAvatar').style.background = getUserColor();
  document.getElementById('composerAvatar').textContent = getInitial();
}

// ===== EMOJI / COLOR GRIDS =====
function buildEmojiGrid() {
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = EMOJIS.map((e,i) =>
    `<button class="emoji-btn${i===0?' selected':''}" onclick="selectEmoji('${e}',this)">${e}</button>`
  ).join('');
}
function buildColorGrid() {
  const grid = document.getElementById('colorGrid');
  grid.innerHTML = COLORS.map((c,i) =>
    `<button class="color-btn${i===0?' selected':''}" onclick="selectColor('${c}',this)" style="background:${c}"></button>`
  ).join('');
}

window.selectEmoji = function(e, btn) {
  selectedEmoji = e;
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
};
window.selectColor = function(c, btn) {
  selectedColor = c;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
};

// ===== PAGES =====
window.showPage = function(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'home') {
    if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
    currentCommunityId = null;
    loadCommunities();
  }
};

// ===== MODAL =====
function openModal(id) { document.getElementById(id).classList.add('open'); }
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
window.showCreateModal = function() {
  if (!requireUsername()) return;
  buildEmojiGrid();
  buildColorGrid();
  document.getElementById('newCommunityName').value = '';
  document.getElementById('newCommunityDesc').value = '';
  selectedEmoji = EMOJIS[0];
  selectedColor = COLORS[0];
  openModal('createModal');
};

// ===== CREATE COMMUNITY =====
window.createCommunity = async function() {
  const name = document.getElementById('newCommunityName').value.trim();
  const desc = document.getElementById('newCommunityDesc').value.trim();
  if (!name) { showToast('⚠️ اكتب اسم المجتمع'); return; }

  try {
    await addDoc(collection(db, 'communities'), {
      name, desc, emoji: selectedEmoji, color: selectedColor,
      createdBy: getUsername(),
      createdAt: serverTimestamp(),
      postCount: 0,
      msgCount: 0
    });
    closeModal('createModal');
    showToast('✅ تم إنشاء المجتمع!');
    loadCommunities();
  } catch (e) {
    showToast('❌ حدث خطأ: ' + e.message);
  }
};

// ===== LOAD COMMUNITIES =====
window.loadCommunities = async function() {
  const grid = document.getElementById('communitiesGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>جاري التحميل...</div>';
  try {
    const snap = await getDocs(query(collection(db, 'communities'), orderBy('createdAt','desc')));
    allCommunities = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCommunities(allCommunities);
  } catch (e) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">تعذر التحميل</div><div class="empty-sub">${e.message}</div></div>`;
  }
};

function renderCommunities(list) {
  const grid = document.getElementById('communitiesGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🌐</div><div class="empty-text">لا توجد مجتمعات بعد</div><div class="empty-sub">كن أول من ينشئ مجتمعاً!</div></div>`;
    return;
  }
  grid.innerHTML = list.map(c => `
    <div class="community-card" onclick="openCommunity('${c.id}')">
      <div class="card-top">
        <div class="card-icon" style="background:${c.color}22;font-size:26px">${c.emoji}</div>
        <div class="card-info">
          <div class="card-name">${c.name}</div>
          <div class="card-desc">${c.desc || 'لا يوجد وصف'}</div>
        </div>
      </div>
      <div class="card-meta">
        <span>📝 ${c.postCount||0} منشور</span>
        <span>💬 ${c.msgCount||0} رسالة</span>
        <span>👤 ${c.createdBy||'مجهول'}</span>
      </div>
    </div>
  `).join('');
}

window.filterCommunities = function() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allCommunities.filter(c =>
    c.name.toLowerCase().includes(q) || (c.desc||'').toLowerCase().includes(q)
  );
  renderCommunities(filtered);
};

// ===== OPEN COMMUNITY =====
window.openCommunity = async function(id) {
  currentCommunityId = id;
  showPage('community');

  try {
    const snap = await getDoc(doc(db, 'communities', id));
    const c = snap.data();
    document.getElementById('communityName').textContent = c.name;
    document.getElementById('communityDesc').textContent = c.desc || '';
    document.getElementById('communityBanner').style.background = `linear-gradient(135deg, ${c.color}33, ${c.color}11)`;
    document.getElementById('communityBanner').textContent = c.emoji;
    document.getElementById('communityPostCount').textContent = c.postCount||0;
    document.getElementById('communityMsgCount').textContent = c.msgCount||0;
  } catch(e) {}

  switchTab('posts');
};

// ===== TABS =====
window.switchTab = function(tab) {
  ['posts','chat'].forEach(t => {
    document.getElementById('tab-content-' + t).style.display = t===tab ? 'block' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t===tab);
  });
  if (tab === 'posts') loadPosts();
  if (tab === 'chat') {
    document.getElementById('tab-content-chat').style.display = 'flex';
    document.getElementById('tab-content-chat').style.flexDirection = 'column';
    loadChat();
  }
};

// ===== POSTS =====
window.loadPosts = async function() {
  const list = document.getElementById('postsList');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>جاري التحميل...</div>';
  try {
    const snap = await getDocs(query(
      collection(db,'communities',currentCommunityId,'posts'),
      orderBy('createdAt','desc')
    ));
    if (snap.empty) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">لا توجد منشورات بعد</div><div class="empty-sub">شارك أول منشور!</div></div>`;
      return;
    }
    list.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const time = p.createdAt ? timeAgo(p.createdAt.toDate()) : '';
      const color = colorFromName(p.author||'؟');
      return `
        <div class="post">
          <div class="post-header">
            <div class="post-avatar" style="background:${color}">${(p.author||'؟')[0]}</div>
            <div>
              <div class="post-author">${p.author||'مجهول'}</div>
              <div class="post-time">${time}</div>
            </div>
          </div>
          <div class="post-body">${escHtml(p.body)}</div>
          <div class="post-actions">
            <button class="post-action" onclick="likePost('${d.id}',this)">
              ❤️ <span>${p.likes||0}</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  } catch(e) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">${e.message}</div></div>`;
  }
};

window.submitPost = async function() {
  if (!requireUsername()) return;
  const body = document.getElementById('postInput').value.trim();
  if (!body) { showToast('⚠️ اكتب شيئاً أولاً'); return; }
  try {
    await addDoc(collection(db,'communities',currentCommunityId,'posts'), {
      body, author: getUsername(),
      createdAt: serverTimestamp(), likes: 0
    });
    await updateDoc(doc(db,'communities',currentCommunityId), { postCount: increment(1) });
    document.getElementById('postInput').value = '';
    showToast('✅ تم النشر!');
    loadPosts();
    document.getElementById('communityPostCount').textContent =
      parseInt(document.getElementById('communityPostCount').textContent||0)+1;
  } catch(e) { showToast('❌ ' + e.message); }
};

window.likePost = async function(postId, btn) {
  try {
    await updateDoc(doc(db,'communities',currentCommunityId,'posts',postId), { likes: increment(1) });
    const span = btn.querySelector('span');
    span.textContent = parseInt(span.textContent)+1;
    btn.classList.add('liked');
    btn.disabled = true;
  } catch(e) {}
};

// ===== CHAT =====
window.loadChat = function() {
  if (chatUnsubscribe) chatUnsubscribe();
  const msgs = document.getElementById('chatMessages');
  msgs.innerHTML = '<div class="loading"><div class="spinner"></div>جاري التحميل...</div>';

  chatUnsubscribe = onSnapshot(
    query(collection(db,'communities',currentCommunityId,'messages'), orderBy('createdAt','asc')),
    snap => {
      msgs.innerHTML = '';
      if (snap.empty) {
        msgs.innerHTML = `<div class="empty"><div class="empty-icon">💬</div><div class="empty-text">لا توجد رسائل بعد</div><div class="empty-sub">ابدأ المحادثة!</div></div>`;
        return;
      }
      snap.docs.forEach(d => {
        const m = d.data();
        const color = colorFromName(m.author||'؟');
        const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}) : '';
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `
          <div class="chat-msg-avatar" style="background:${color}">${(m.author||'؟')[0]}</div>
          <div class="chat-msg-content">
            <div class="chat-msg-name">${m.author||'مجهول'}</div>
            <div class="chat-msg-bubble">${escHtml(m.body)}</div>
            <div class="chat-msg-time">${time}</div>
          </div>
        `;
        msgs.appendChild(div);
      });
      msgs.scrollTop = msgs.scrollHeight;
    }
  );
};

window.sendChat = async function() {
  if (!requireUsername()) return;
  const input = document.getElementById('chatInput');
  const body = input.value.trim();
  if (!body) return;
  try {
    input.value = '';
    input.style.height = 'auto';
    await addDoc(collection(db,'communities',currentCommunityId,'messages'), {
      body, author: getUsername(), createdAt: serverTimestamp()
    });
    await updateDoc(doc(db,'communities',currentCommunityId), { msgCount: increment(1) });
    document.getElementById('communityMsgCount').textContent =
      parseInt(document.getElementById('communityMsgCount').textContent||0)+1;
  } catch(e) { showToast('❌ ' + e.message); }
};

// ===== HELPERS =====
function requireUsername() {
  if (!getUsername()) { showUsernameModal(); return false; }
  return true;
}

function colorFromName(name) {
  const colors = ['#6c63ff','#ff6584','#43e97b','#f7971e','#4facfe','#f953c6','#43cbff','#f093fb'];
  let hash = 0;
  for (let i=0; i<name.length; i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return colors[Math.abs(hash) % colors.length];
}

function timeAgo(date) {
  const s = Math.floor((new Date() - date) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return `منذ ${Math.floor(s/60)} دقيقة`;
  if (s < 86400) return `منذ ${Math.floor(s/3600)} ساعة`;
  return `منذ ${Math.floor(s/86400)} يوم`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
}

window.autoResize = function(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
};

window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
};

// ===== INIT =====
updateTopbar();
loadCommunities();

if (!getUsername()) {
  setTimeout(() => openModal('usernameModal'), 600);
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => {
    if (e.target === o) o.classList.remove('open');
  });
});

</script>
</body>
